  /me/accessRestriction: {namespace: iam, area: true}
  /me/sshKey: {namespace: iam, name: ssh_keys}
  /cloud/project/{serviceName}/user: {namespace: iam, name: cloud_users, scope: {serviceName: project}}
  /cloud/project/{serviceName}/sshkey: {namespace: iam, name: cloud_ssh_keys, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/sshKey: {namespace: iam, name: public_cloud_ssh_keys, scope: {projectId: project}}
  /publicCloud/project/{projectId}/keyManager: {namespace: iam, area: true, prefix: public_cloud, scope: {projectId: project}}

  # account
  /me: {namespace: account, area: true}
  /auth: {namespace: account, area: true}
  /cloud: {namespace: account, area: true}
  /cloud/project: {namespace: account, name: cloud_projects}
  /publicCloud: {namespace: account, area: true}
  /publicCloud/project: {namespace: account, name: public_cloud_projects}
  /newAccount: {namespace: account, area: true}
  /partner: {namespace: account, area: true}
