  /me/order: {namespace: orders, name: orders}
  /commercialCatalog: {namespace: orders, area: true}
  /price: {namespace: orders, area: true}

  # telecom
  /telephony: {namespace: telecom, name: telephony}
  /sms: {namespace: telecom, name: sms}
  /freefax: {namespace: telecom, name: fax}
  /xdsl: {namespace: telecom, name: xdsl}
