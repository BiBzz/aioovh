# Collection names inside an area or under a resource, keyed by
# "<namespace>:<path segments>" as docs/objects.md shows them.
collections: {}

# Member names, keyed by "<namespace>:<path segments>:<generated name>".
members: {}

# APIs kept in the operations layer only, with the reason.
raw_only:
  /metrics: every operation is deprecated
  /products: models only, no operation
