  /me/correctiveInvoice: {namespace: billing, name: corrective_invoices}
  /me/downPaymentInvoice: {namespace: billing, name: down_payment_invoices}
  /me/reverseBill: {namespace: billing, name: reverse_bills}
  /me/deposit: {namespace: billing, name: deposits}
  /me/debtAccount: {namespace: billing, area: true}
  /me/payment: {namespace: billing, area: true}
  /me/paymentMean: {namespace: billing, area: true}
  /me/credit: {namespace: billing, area: true}
  /me/voucher: {namespace: billing, area: true}
  /me/fidelityAccount: {namespace: billing, area: true}
  /me/ovhAccount: {namespace: billing, name: ovh_accounts}
  /me/withdrawal: {namespace: billing, name: withdrawals}
  /me/consumption: {namespace: billing, area: true}
  /me/billing: {namespace: billing, area: true}
  /me/availableAutomaticPaymentMeans: {namespace: billing, area: true}
  /services: {namespace: billing, name: services}
