# Where every part of the OVHcloud API goes in the object layer.
#
# roots: an API path (as written in the schemas, versions left out) and what
# it becomes. The longest matching root wins.
#   namespace: business area (shared with aioscaleway)
#   name: collection name (a path ending in a collection with items)
#   area: true for a path that is not a resource (`/me`, `/iam`): its
#     children become collections or methods of the namespace
#   scope: path parameters of the root that become keywords with a default
#     from the settings, as a project
roots:
  # compute
  /dedicated/server: {namespace: compute, name: dedicated_servers}
  /dedicated/cluster: {namespace: compute, name: dedicated_clusters}
  /dedicated/housing: {namespace: compute, name: housings}
  /dedicated/installationTemplate: {namespace: compute, name: installation_templates}
  /vps: {namespace: compute, name: vps}
  /cloud/project/{serviceName}/instance: {namespace: compute, name: instances, scope: {serviceName: project}}
  /cloud/project/{serviceName}/image: {namespace: compute, name: images, scope: {serviceName: project}}
  /cloud/project/{serviceName}/flavor: {namespace: compute, name: flavors, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/compute: {namespace: compute, area: true, prefix: public_cloud, scope: {projectId: project}}

  # storage and backup
  /dedicated/nasha: {namespace: storage, name: nas}
  /dedicated/ceph: {namespace: storage, name: ceph_clusters}
  /storage: {namespace: storage, area: true}
  /cloud/project/{serviceName}/volume: {namespace: storage, name: volumes, scope: {serviceName: project}}
  /cloud/project/{serviceName}/snapshot: {namespace: storage, name: snapshots, scope: {serviceName: project}}
  /cloud/project/{serviceName}/storage: {namespace: storage, name: object_containers, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/storage: {namespace: storage, area: true, prefix: public_cloud, scope: {projectId: project}}
  /veeamCloudConnect: {namespace: backup, name: veeam_cloud_connect}
  /veeam/veeamEnterprise: {namespace: backup, name: veeam_enterprise}
  /backupServices: {namespace: backup, area: true}

  # network
  /ip: {namespace: network, name: ips}
  /ipLoadbalancing: {namespace: network, name: load_balancers}
  /vrack: {namespace: network, name: vracks}
  /vrackServices: {namespace: network, area: true}
  /ovhCloudConnect: {namespace: network, name: interconnects}
  /cdn/dedicated: {namespace: network, name: cdns}
  /sslGateway: {namespace: network, name: ssl_gateways}
  /networkDefense: {namespace: network, area: true}
  /cloud/project/{serviceName}/network: {namespace: network, area: true, scope: {serviceName: project}}
  /cloud/project/{serviceName}/loadbalancer: {namespace: network, name: cloud_load_balancers, scope: {serviceName: project}}
  /cloud/project/{serviceName}/ip: {namespace: network, name: cloud_ips, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/network: {namespace: network, name: networks, scope: {projectId: project}}
  /publicCloud/project/{projectId}/gateway: {namespace: network, name: gateways, scope: {projectId: project}}
  /publicCloud/project/{projectId}/loadbalancer: {namespace: network, name: public_cloud_load_balancers, scope: {projectId: project}}
  /publicCloud/project/{projectId}/publicIp: {namespace: network, name: public_ips, scope: {projectId: project}}
  /publicCloud/project/{projectId}/securityGroup: {namespace: network, name: security_groups, scope: {projectId: project}}
  /publicCloud/project/{projectId}/privateEndpoint: {namespace: network, name: private_endpoints, scope: {projectId: project}}

  # kubernetes
  /cloud/project/{serviceName}/kube: {namespace: kubernetes, name: clusters, scope: {serviceName: project}}
  /cloud/project/{serviceName}/containerRegistry: {namespace: kubernetes, name: registries, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/managedKubernetes: {namespace: kubernetes, area: true, prefix: public_cloud, scope: {projectId: project}}
  /publicCloud/project/{projectId}/rancher: {namespace: kubernetes, name: rancher, scope: {projectId: project}}

  # databases, analytics, ai
  /cloud/project/{serviceName}/database: {namespace: databases, area: true, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/managedDatabase: {namespace: databases, area: true, prefix: managed, scope: {projectId: project}}
  /hosting/privateDatabase: {namespace: web_hosting, name: private_databases}
  /publicCloud/project/{projectId}/managedAnalytics: {namespace: analytics, area: true, scope: {projectId: project}}
  /cluster/hadoop: {namespace: analytics, name: hadoop_clusters}
  /cloud/project/{serviceName}/ai: {namespace: ai, area: true, scope: {serviceName: project}}
  /cloud/project/{serviceName}/lab: {namespace: ai, name: labs, scope: {serviceName: project}}
  /cloud/project/{serviceName}/quantum: {namespace: ai, area: true, prefix: quantum, scope: {serviceName: project}}
  /publicCloud/project/{projectId}/ai: {namespace: ai, area: true, prefix: public_cloud, scope: {projectId: project}}

  # email, domains, web hosting
  /email/domain: {namespace: email, name: mail_domains}
  /email/exchange: {namespace: email, area: true}
  /email/mxplan: {namespace: email, name: mx_plans}
  /email/pro: {namespace: email, name: email_pro}
