  /me/fax: {namespace: telecom, area: true}

  # licenses
  /license/cloudLinux: {namespace: licenses, name: cloud_linux}
  /license/cpanel: {namespace: licenses, name: cpanel}
  /license/directadmin: {namespace: licenses, name: directadmin}
  /license/hycu: {namespace: licenses, name: hycu}
